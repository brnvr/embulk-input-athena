plugins {
    id "maven-publish"
    id "com.github.jruby-gradle.base" version "1.5.0"
    id "java"
    id "checkstyle"
    // for task download
    id "de.undercouch.download" version "3.4.2"
}
import com.github.jrubygradle.JRubyExec
repositories {
    mavenCentral()
}
configurations {
    provided
}

version = "0.1.8"

sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    // Replace these lines:
    // compile  "org.embulk:embulk-core:0.9.25"
    // provided "org.embulk:embulk-core:0.9.25"
    
    // With this (adjust the path to where your jar is located):
    compile files('/home/bruno/indicium/_other/temp/embulk-input-athena/embulk-core-0.9.25.jar')
    provided files('/home/bruno/indicium/_other/temp/embulk-input-athena/embulk-core-0.9.25.jar')
    compile 'org.slf4j:slf4j-api:1.7.25'   
    // Rest of your dependencies remain the same
    compile files('build/AthenaJDBC41.jar')
    compile group: 'com.amazonaws', name: 'aws-java-sdk', version: '1.11.301'
    compile 'org.embulk:embulk-input-jdbc:0.12.2'
    testCompile "junit:junit:4.+"
}

task downloadFile(type: Download) {
    src 'https://s3.amazonaws.com/athena-downloads/drivers/JDBC/SimbaAthenaJDBC-2.0.23.1000/AthenaJDBC41.jar'
    dest buildDir
    onlyIfModified true
}

task classpath(type: Copy, dependsOn: ["downloadFile", "jar"]) {
    doFirst { file("classpath").deleteDir() }
    from (configurations.runtime - configurations.provided + files(jar.archivePath))
    from ("build/AthenaJDBC41.jar")
    into "classpath"
}
clean { delete "classpath" }

checkstyle {
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
    toolVersion = '6.14.1'
}
checkstyleMain {
    configFile = file("${project.rootDir}/config/checkstyle/default.xml")
    ignoreFailures = true
}
checkstyleTest {
    configFile = file("${project.rootDir}/config/checkstyle/default.xml")
    ignoreFailures = true
}
task checkstyle(type: Checkstyle) {
    classpath = sourceSets.main.output + sourceSets.test.output
    source = sourceSets.main.allJava + sourceSets.test.allJava
}

task gem(type: JRubyExec, dependsOn: ["gemspec", "classpath"]) {
    jrubyArgs "-S"
    script "gem"
    scriptArgs "build", "${project.name}.gemspec"
    doLast { ant.move(file: "${project.name}-${project.version}.gem", todir: "pkg") }
}

task gemPush(type: JRubyExec, dependsOn: ["gem"]) {
    jrubyArgs "-S"
    script "gem"
    scriptArgs "push", "pkg/${project.name}-${project.version}.gem"
}

task "package"(dependsOn: ["gemspec", "classpath"]) {
    doLast {
        println "> Build succeeded."
        println "> You can run embulk with '-L ${file(".").absolutePath}' argument."
    }
}

task gemspec {
    ext.gemspecFile = file("${project.name}.gemspec")
    inputs.file "build.gradle"
    outputs.file gemspecFile
    doLast { gemspecFile.write($/
Gem::Specification.new do |spec|
  spec.name          = "${project.name}"
  spec.version       = "${project.version}"
  spec.authors       = ["shinji19", "brnvr"]
  spec.summary       = %[Athena input plugin for Embulk]
  spec.description   = %[Loads records from Athena.]
  spec.email         = [""]
  spec.licenses      = ["MIT"]
  spec.homepage      = "https://github.com/shinji19/embulk-input-athena"

  spec.files         = `git ls-files`.split("\n") + Dir["classpath/*.jar"]
  spec.test_files    = spec.files.grep(%r"^(test|spec)/")
  spec.require_paths = ["lib"]

  #spec.add_dependency 'YOUR_GEM_DEPENDENCY', ['~> YOUR_GEM_DEPENDENCY_VERSION']
  spec.add_development_dependency 'bundler', ['~> 1.0']
  spec.add_development_dependency 'rake', ['>= 10.0']
end
/$)
    }
}
clean { delete "${project.name}.gemspec" }

// Add maven-publish configuration
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}